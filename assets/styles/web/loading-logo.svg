<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 600" width="384" height="450" role="img" aria-labelledby="t d">
  <title id="t">GridCraft</title>
  <desc id="d">An animated ledger page with spreadsheet grid, green header band, cell selection, and fill handle, forming the GridCraft logo.</desc>
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="tile-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24b162"/>
      <stop offset="100%" stop-color="#107c41"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22a85b"/>
      <stop offset="100%" stop-color="#107c41"/>
    </linearGradient>
  </defs>
  <style>
    :root {
      --word: #107c41;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --word: #5cc587;
      }
    }
    .word {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 64px;
      fill: var(--word);
      letter-spacing: -0.5px;
    }
    .all {
      animation: all-loop 5.2s linear infinite;
    }
    .mark {
      transform-origin: 256px 256px;
      animation: mark-in 5.2s cubic-bezier(0.2, 1.2, 0.4, 1) infinite;
    }
    .sheet {
      animation: sheet-in 5.2s ease-out infinite;
    }
    .header {
      animation: header-in 5.2s ease-out infinite;
    }
    .lines {
      animation: lines-in 5.2s ease-out infinite;
    }
    .cell {
      transform-box: fill-box;
      transform-origin: center;
      animation: cell-in 5.2s cubic-bezier(0.2, 1.3, 0.4, 1) infinite;
    }
    .total {
      animation: total-in 5.2s ease-out infinite;
    }
    .wordg {
      transform-origin: 256px 582px;
      animation: word-in 5.2s ease-out infinite;
    }

    @keyframes all-loop {
      0% { opacity: 0; }
      2.5%, 96.5% { opacity: 1; }
      99.5%, 100% { opacity: 0; }
    }
    @keyframes mark-in {
      0%, 2% { opacity: 0; transform: scale(0.85); }
      12%, 100% { opacity: 1; transform: scale(1); }
    }
    @keyframes sheet-in {
      0%, 8% { opacity: 0; }
      18%, 100% { opacity: 1; }
    }
    @keyframes header-in {
      0%, 18% { opacity: 0; }
      28%, 100% { opacity: 1; }
    }
    @keyframes lines-in {
      0%, 28% { opacity: 0; }
      38%, 100% { opacity: 1; }
    }
    @keyframes cell-in {
      0%, 38% { opacity: 0; transform: scale(0.85); }
      48%, 100% { opacity: 1; transform: scale(1); }
    }
    @keyframes total-in {
      0%, 48% { opacity: 0; }
      58%, 100% { opacity: 1; }
    }
    @keyframes word-in {
      0%, 10% { opacity: 0; transform: translateY(8px); }
      22%, 100% { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .all, .mark, .sheet, .header, .lines, .cell, .total, .wordg {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
  <g class="all">
    <g class="mark">
      <g clip-path="url(#tile)">
        <rect width="512" height="512" fill="url(#tile-grad)"/>
        <g transform="rotate(-6 256 268)" stroke="#0b0b0c" stroke-linejoin="round" stroke-linecap="round">
          <!-- page with folded top-right corner -->
          <g class="sheet">
            <path d="M112 76 H336 L404 144 V440 H112 Z" fill="#efe9dc" stroke-width="14"/>
            <path d="M336 76 V144 H404" fill="none" stroke-width="12"/>
            <!-- title lines -->
            <path d="M146 106 H272 M146 130 H232" stroke-width="12"/>
          </g>
          <!-- header row and row-number column -->
          <path class="header" d="M112 164 H404 V204 H164 V440 H112 Z" fill="url(#header-grad)" stroke="none"/>
          <!-- grid lines -->
          <path class="lines" d="M112 164 H404 M112 204 H404 M112 250 H404 M112 296 H404 M112 342 H404 M112 388 H404
                   M164 164 V440 M244 164 V440 M324 164 V440" fill="none" stroke-width="8"/>
          <!-- selected cell and fill handle -->
          <g class="cell">
            <rect x="244" y="250" width="80" height="46" fill="none" stroke-width="16"/>
            <rect x="312" y="284" width="24" height="24" fill="#0b0b0c" stroke="#efe9dc" stroke-width="5"/>
          </g>
          <!-- double rule under the total -->
          <path class="total" d="M252 410 H316 M252 424 H316" stroke-width="7"/>
        </g>
      </g>
    </g>
    <text class="word wordg" x="256" y="582" text-anchor="middle">GridCraft</text>
  </g>
</svg>
